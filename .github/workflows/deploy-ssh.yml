name: CI/CD - Deploy con SSH Directo (Opción 2)

on:
  # Se puede disparar manualmente o al hacer push cuando se prefiera esta opción
  workflow_dispatch:

jobs:
  test:
    name: Ejecutar Tests Unitarios
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests automáticos
        run: npm test

  deploy-ssh:
    name: Desplegar mediante SSH
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar comandos de despliegue remoto vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP_DIR="/opt/node-service"

            echo "=== 1. Comprobando directorio de la app ==="
            if [ ! -d "$APP_DIR" ]; then
              echo "Directorio no existe, clonando repositorio..."
              git clone https://github.com/${{ github.repository }}.git $APP_DIR
            fi

            echo "=== 2. Actualizando código fuente ==="
            cd $APP_DIR
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            echo "=== 3. Instalando dependencias de producción ==="
            npm install --omit=dev

            echo "=== 4. Reiniciando servicio systemd ==="
            systemctl restart node_service

            echo "=== 5. Estado del servicio ==="
            systemctl status node_service --no-pager
